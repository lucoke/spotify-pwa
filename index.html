<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest">
<title>Spotify</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #121212;
  }
</style>
</head>
<body>
<script>
  function goToSpotify() {
    location.replace("https://open.spotify.com/");
  }

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").then(goToSpotify, goToSpotify);
  } else {
    goToSpotify();
  }
</script>
</body>
</html>
